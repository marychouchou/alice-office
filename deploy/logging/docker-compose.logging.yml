# 選配（opt-in）的集中式 log 堆疊 — Alloy 收集、Loki 儲存、Grafana 查詢。
# 設計與取捨見 docs/logging-design.md（§3 方案比較、§5.3–§5.6 實作細節）。
#
# 啟用（一定要從 repo 根目錄執行，相對路徑與 ${PWD} 都以它為基準）：
#   GRAFANA_ADMIN_PASSWORD=... docker compose \
#     -f docker-compose.yml -f deploy/logging/docker-compose.logging.yml up -d
# 或 ./scripts/deploy_host.sh --with-logging
#
# 三個服務只掛在自己的 logging_net 上，**刻意不接 hermes_global_net**：
# 每個房間的 agent 容器都在 hermes_global_net 上，而 Loki 沒有 auth
# （auth_enabled: false），同網段就等於任何一個房間的 agent 都能 curl 到
# Loki、讀到所有房間的 log、灌假的行進去。Alloy 不需要那個網段——它是用
# docker.sock 的 Docker API 讀容器 stdout，用 ro mount 讀檔案 log，兩條路
# 都不經過容器網路（docs/logging-design.md §6）。
services:
  alloy:
    # Alloy 是 Promtail 的官方繼任者（Promtail 2026-03 EOL）。pin 到明確版本，
    # 不用 latest：收集器換版會改 component 參數名，漂移會在半夜靜默壞掉。
    image: grafana/alloy:v1.19.2
    container_name: alloy
    command:
      - run
      # positions / WAL 都寫在這裡；沒有這個 named volume，重啟會把每個房間的
      # logs/*.log 從頭重讀一次（重複行）。
      - --storage.path=/var/lib/alloy/data
      # Alloy 自己的 UI（元件圖、每個 target 的狀態）綁在容器內的 loopback：
      # 沒對 host 開 port，也不對 logging_net 上的鄰居開。要看就
      # `docker exec alloy wget -qO- http://127.0.0.1:12345/`。
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    volumes:
      # 唯讀的 docker.sock：discovery.docker 用它列容器、loki.source.docker 用它
      # 讀 stdout。即使唯讀，能讀 docker.sock 就等於能讀主機上每個容器的
      # 環境變數與 log——這是一個真實的信任邊界（§6）。
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 每個房間的檔案 log（agent.log / errors.log / ...）。HOST_DATA_DIR 必須跟
      # router 用的那個是同一個目錄，否則這裡會掛到空的資料夾——見 docs/env-data-paths.md。
      #
      # 這裡的巢狀預設值（`${VAR:-${PWD}/data}`）在 Docker Compose v5.1.3 實測過
      # （2026-09-14，`docker compose ... config | grep -A2 rooms` 三種情況）：
      # HOST_DATA_DIR 沒設（連 .env 都沒有，`--env-file /dev/null`）時展開成
      # `<repo>/data`、設成空字串時同樣走預設、設成 `/tmp/xyzdata` 時用該值。
      # 要換收集器或大幅降版 Compose 時值得重測一次，因為巢狀展開沒有寫進
      # Compose 的規格文件裡。
      - ${HOST_DATA_DIR:-${PWD}/data}:/rooms:ro
      - ./deploy/logging/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - logging_net
    restart: unless-stopped
    # 刻意沒有 alice.role label：Alloy 自己不能是自己的採集對象。Loki 掛掉時
    # Alloy 每次 push 失敗都會寫一行 error 到 stdout，如果它也被 pipeline 1
    # 收走，這些行會排隊等著 push 給那個掛掉的 Loki——故障時自我放大。
    # loki / grafana 留著 label（它們的 stdout 才是查「堆疊為什麼壞了」的來源）。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:3.7.7
    container_name: loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/logging/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    # 刻意沒有 ports：Loki 沒有 auth（auth_enabled: false），只能被同一個
    # logging_net 內的 Alloy 與 Grafana 存取（§6）。
    networks:
      - logging_net
    restart: unless-stopped
    labels:
      alice.role: infra
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    environment:
      # 沒設就直接讓 compose 失敗，不要靜默起一個 admin/admin 的 Grafana。
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?請在 .env 設 GRAFANA_ADMIN_PASSWORD（見 .env.example）}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    ports:
      # 只綁 127.0.0.1：operator 從自己的機器用 SSH tunnel 連進來
      #   ssh -N -L 3000:127.0.0.1:3000 <user>@<host>
      # 這個 publish 就是 logging_net 不能設 internal: true 的原因。
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/logging/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - logging_net
    restart: unless-stopped
    depends_on:
      - loki
    labels:
      alice.role: infra
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # 這個堆疊專用的 bridge，由 compose 建立（實際名稱是 <project>_logging_net）。
  # 不能設 internal: true，因為 Grafana 要 publish 127.0.0.1:3000。
  logging_net:
    driver: bridge

volumes:
  alloy-data:
  loki-data:
  grafana-data:
