model:
  default: {model}
  provider: custom
  # Hermes cannot read this window from the provider (a LiteLLM proxy whose
  # /model/info reports no max_input_tokens), so it falls back to a hardcoded
  # 131,072 for any "qwen" model — half the real window (max_model_len
  # 262,144, verified 2026-09-15 by probing the endpoint). With the wrong
  # figure Hermes compressed every second call at ~88K. State it explicitly.
  context_length: 262144
  # Output cap per request. Hermes otherwise reserves half the context window
  # as output budget on EVERY request, so a prompt of ~131K tokens already
  # fails with "context length exceeded" — long before Hermes's own
  # compression (floored at 75% of the window, ~197K) could ever run. 32K is
  # enough for a 13 KB Markdown write_file in one call (16K truncated it) and
  # still leaves ~230K for the prompt.
  max_tokens: 32768
providers:
  custom:
    base_url: {base_url}
    key_env: LLM_API_KEY
    default_model: {model}
    models:
      - {model}
    # Sent verbatim in the request body. Turns off qwen3's thinking mode: one
    # thinking-heavy call produced 64K reasoning tokens, and Hermes replays
    # reasoning_content into every later call of the turn, so a single turn
    # ran 13+ minutes and then overflowed the context. Remove this block for a
    # deployment whose model/provider ignores it or where thinking is wanted.
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
{plugins_section}
{mcp_section}
tools:
  tool_search:
    threshold_pct: 20
# Dangerous-command approvals: nobody can answer an approval prompt on the
# api_server path (LINE users never see it), so "manual" turns every flagged
# command — `python -c`, `pip install`, execute_code — into a dead end the
# agent burns several calls on. "smart" lets the auxiliary model auto-approve
# the obviously harmless ones and still blocks genuinely destructive ones.
approvals:
  mode: smart
# Both default to "let it run forever" (max_turns: none) and "warn but never
# block" (hard_stop_enabled: false — Hermes treats api_server/LINE turns as
# interactive, so guardrails only warn by default). Neither ever fires on the
# LINE path: no human is watching to notice a turn is spiraling, so the only
# backstop was the router's own HERMES_REQUEST_TIMEOUT_SECONDS (3600s) —
# observed 2026-09-16 letting a weather lookup retry through 28 tool-calling
# rounds over 7+ minutes before Hermes itself gave up. Capping both here
# makes Hermes cut a stuck turn off in seconds, not the better part of an
# hour.
agent:
  max_turns: 20
tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 3
    same_tool_failure: 4
    idempotent_no_progress: 3
